<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Админ-панель | ООО «Константа»</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <div class="brand">
          <div class="brand-mark">К</div>
          <div>
            <span class="brand-name">ООО «Константа»</span>
            <small>Админ-панель</small>
          </div>
        </div>
        <nav class="main-nav">
          <a href="/">Главная</a>
          <a href="/about">О компании</a>
          <a href="/services">Услуги</a>
          <a href="/objects">Объекты</a>
          <a href="/contacts">Контакты</a>
          <a href="/admin">Админ</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="page-hero">
        <div class="container narrow">
          <span class="eyebrow">Редактирование</span>
          <h1>Админ-панель контента</h1>
        </div>
      </section>

      <section class="section">
        <div class="container admin-layout">
          <div class="card admin-panel">
            <h3>Редактировать JSON</h3>
            <textarea id="contentEditor" rows="25"></textarea>
            <button id="saveContentBtn" class="btn btn-primary">Сохранить</button>
            <p id="adminStatus" class="form-status"></p>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div>
          <strong>ООО «Константа»</strong>
          <p>Управляющая компания</p>
        </div>
      </div>
    </footer>

    <script src="/main.js"></script>

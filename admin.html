<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Панель администратора | ООО «Константа»</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="index.html" class="brand" aria-label="ООО Константа главная">
          <span class="brand-mark">К</span>
          <span class="brand-text">
            <strong>ООО «Константа»</strong>
            <small>Управляющая компания</small>
          </span>
        </a>

        <nav class="main-nav" aria-label="Основная навигация">
          <a href="index.html">Главная</a>
          <a href="contacts.html">Контакты</a>
        </nav>
      </div>
    </header>

    <main class="section">
      <div class="container" style="max-width: 980px;">
        <div class="section-heading">
          <span class="eyebrow">Администрирование</span>
          <h1>Панель администратора</h1>
        </div>

        <div class="card" style="padding: 2rem;">
          <textarea id="contentEditor" rows="28" style="width: 100%; resize: vertical; font-family: 'SFMono-Regular', Consolas, monospace; font-size: 0.92rem; border: 1px solid #d8deea; border-radius: 12px; padding: 1rem;"></textarea>
          <div style="display: flex; align-items: center; gap: 1rem; margin-top: 1rem; flex-wrap: wrap;">
            <button id="saveContentBtn" class="btn btn-primary" type="button">Сохранить</button>
            <span id="adminStatus" aria-live="polite" style="color: #0f4c81; font-weight: 600;"></span>
          </div>
        </div>
      </div>
    </main>

    <script src="main.js"></script>
  </body>
</html>
